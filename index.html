<style>
:root{--ink:#24283b;--muted:#646a7c;--purple:#5942a1;--line:#e3e5ed}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:white;font:14px/1.45 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:1250px;margin:auto;padding:16px}.toolbar{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:4px}.search-wrap{position:relative;flex:1;min-width:230px;max-width:530px}input[type=search]{width:100%;font:inherit;border:1px solid #aeb3c3;border-radius:8px;padding:11px 13px;color:var(--ink)}.labels{display:flex;align-items:center;gap:6px;white-space:nowrap;margin-left:auto;font-size:13px}input[type=checkbox]{accent-color:var(--purple)}button,a,input,summary{touch-action:manipulation}button{font:inherit;color:inherit;cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #7960c5;outline-offset:3px}.reset{border:1px solid var(--line);background:white;border-radius:7px;padding:8px 12px}.reset:hover{background:#f4f1fb}.suggestions{position:absolute;top:calc(100% + 5px);left:0;right:0;background:white;border:1px solid var(--line);border-radius:8px;box-shadow:0 6px 25px #24283b20;z-index:5;overflow:hidden}.option{padding:11px 13px;cursor:pointer;border-bottom:1px solid #f0f1f5}.option:last-child{border:0}.option:hover,.option[aria-selected=true]{background:#f1edfa;color:#453180}.hidden{display:none!important}.scroll{overflow-x:auto}.graph{min-width:760px;position:relative}svg{width:100%;height:auto;display:block}.grid{stroke:#e9ebf1;stroke-width:1}.tick{fill:#73798b;font-size:12px}.axis{fill:#30364a;font-size:16px;font-weight:650}.axis-note{fill:#747a8a;font-size:12px}.point{outline:none}.point .dot{stroke:white;stroke-width:2}.point:hover .dot,.point:focus .dot{stroke:#24283b;stroke-width:3}.point:focus .halo{stroke:#24283b}.halo{fill:none;stroke:transparent;stroke-width:2}.point-label{font-size:12px;font-weight:650;fill:#30364a;paint-order:stroke;stroke:white;stroke-width:3px;stroke-linejoin:round;pointer-events:none}.legend{position:absolute;right:5.5%;bottom:17%;width:22%;min-width:170px;max-width:220px;padding:8px;background:#ffffffed;border:1px solid var(--line);border-radius:9px}.legend-top{display:flex;align-items:center;justify-content:space-between;padding:0 5px 6px;font-size:11px;color:var(--muted)}.legend-top button{border:0;background:none;font-size:11px;color:var(--purple);padding:3px 5px}.categories{display:grid;grid-template-columns:1fr 1fr;gap:3px}.chip{display:flex;align-items:center;gap:6px;text-align:left;font-size:11px;min-height:31px;padding:5px;border:1px solid transparent;background:transparent;border-radius:5px;line-height:1.2}.chip:hover{background:#f4f2f9}.chip[aria-pressed=true]{background:#f0edf8;border-color:#c4b7e4;font-weight:650}.swatch{height:9px;width:9px;border-radius:50%;flex-shrink:0;background:var(--color)}.results{display:flex;gap:10px;align-items:center;color:var(--muted);font-size:12px;padding:4px 0 10px}.results strong{color:var(--ink)}.empty{position:absolute;top:15%;left:25%;background:white;padding:15px;color:var(--muted)}.table-scroll{overflow:auto;max-height:70vh;position:relative;border:1px solid var(--line);border-radius:8px;scroll-padding-top:48px}table{border-collapse:separate;border-spacing:0;width:100%;font-size:13px}th,td{padding:11px 10px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}th{background:#f6f6fa;font-size:12px;font-weight:650;white-space:nowrap}.category-row th{background:#eeedf5;color:#45405b;font-size:12px;padding-top:13px;padding-bottom:9px}.category-row .swatch{display:inline-block;margin-right:7px}thead th{position:sticky;top:0;z-index:2;background:#f6f6fa;box-shadow:0 1px 0 #d7dae5}th button{border:0;background:transparent;font-size:inherit;font-weight:inherit;padding:0;color:inherit}td a{color:#513c94;font-weight:650;text-decoration:none}td a:hover{text-decoration:underline}td small{display:block;color:var(--muted);font-size:11px;margin-top:3px}.score{font-variant-numeric:tabular-nums}.difficulty-low{background:#eff6f5}.difficulty-medium{background:#fbf5e9}.difficulty-high{background:#faeded}.novelty-low{background:#f8f6fc}.novelty-medium{background:#eee8f7}.novelty-high{background:#e1d7f0}.description{min-width:210px}.tooltip{position:fixed;z-index:10;pointer-events:none;max-width:340px;background:#252a40;color:white;padding:14px 16px;border-radius:9px;box-shadow:0 5px 24px #11182c25;font-size:12px}.tooltip strong{font-size:14px}.tooltip p{margin:6px 0 0}.tooltip .sub{color:#dcdeea}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}noscript p{padding:15px}@media(max-width:600px){main{padding:10px}.toolbar{gap:9px}.search-wrap{flex-basis:100%;max-width:none}.labels{margin-left:0}.reset{margin-left:auto}.tooltip{max-width:290px}.legend{right:5%}td,th{padding:9px 8px}} 
</style></head><body><main>
<div class="toolbar"><div class="search-wrap"><label for="search" class="sr-only">Search datasets by name, description, or keyword</label><input id="search" type="search" placeholder="Search datasets…" autocomplete="off" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="suggestions" aria-describedby="searchHelp"><span class="sr-only" id="searchHelp">Type at least two characters for suggestions. Enter filters matching datasets. Use the arrow keys and Enter to select a suggestion.</span><div id="suggestions" class="suggestions hidden" role="listbox" aria-label="Dataset suggestions"></div></div><label class="labels"><input id="labels" type="checkbox">Show all names</label><button id="reset" class="reset" type="button">Reset</button></div>

aria-describedby="plotDesc"><desc id="plotDesc">Each point links to a dataset in a new tab. Difficulty increases to the right; novelty increases upward. A searchable table follows the chart.</desc><g id="grid"></g><g id="points"></g><g id="names" aria-hidden="true"></g></svg><div class="legend" aria-label="Category filters"><div class="legend-top"><span>Category</span><button id="all" type="button" aria-pressed="true">All</button></div><div id="categories" class="categories"></div></div><div id="empty" class="empty hidden">No matching datasets.</div></div></div>
<div class="results" role="status" id="count"></div><div class="table-scroll" role="region" aria-label="Dataset table with fixed column headings" tabindex="0"><table><caption class="sr-only">Dataset descriptions and ratings. Grouped alphabetically by category. Column headings sort within each category.</caption><thead><tr><th scope="col" aria-sort="ascending"><button type="button" data-sort="title">Dataset ↕</button></th><th scope="col">Description</th><th scope="col" aria-sort="none"><button type="button" data-sort="difficulty" title="Low: 1–3.9; medium: 4–6.9; high: 7–10. Sort within categories.">Difficulty ↕</button></th><th scope="col" aria-sort="none"><button type="button" data-sort="novelty" title="Low: 1–3.9; medium: 4–6.9; high: 7–10. Sort within categories.">Novelty ↕</button></th></tr></thead><tbody id="rows"></tbody></table></div>

<script>
'use strict';
const DATA = [{"id": 0, "title": "Baby Names", "categories": ["Kids"], "difficulty": 4.3, "novelty": 8.5, "description": "Frequencies of baby names across years and sex, with national and geographic versions available.", "dwhy": "Large files; sum frequencies rather than count rows and distinguish counts from popularity shares.", "nwhy": "Reveals naming fashions, generational shifts, and differences that casual familiarity rarely captures.", "url": "https://drive.google.com/drive/folders/1mioOCEyxfZG9FUSdhAgqqBg1M24mrAy6", "provisional": false, "keywords": ["infants", "children", "naming", "trends", "gender", "generations", "popularity", "parents", "SSA"], "label": "Baby Names"}, {"id": 1, "title": "Animals in Kids Books", "categories": ["Kids"], "difficulty": 3.8, "novelty": 9.7, "description": "Animal characters and pronouns in children’s books, alongside survey responses to animal story prompts.", "dwhy": "Mostly accessible categories; book records and survey responses represent different observational units.", "nwhy": "A distinctive look at gender associations and animal representation in familiar stories.", "url": "https://docs.google.com/spreadsheets/d/1rL4lNTe5PPgAv4Zj9XIwTevNC2qgN-7QrC_n0WF8ki4/edit", "provisional": false, "keywords": ["children", "literature", "stories", "reading", "animals", "gender", "pronouns", "representation", "books"], "label": "Kids’ Books"}, {"id": 2, "title": "Broadway Shows", "categories": ["Art"], "difficulty": 4.1, "novelty": 7.3, "description": "Weekly attendance, revenue, capacity, and performance information for Broadway productions.", "dwhy": "Repeated show-weeks require care with totals, averages, and comparisons across runs.", "nwhy": "A behind-the-scenes view of audience demand and commercial performance.", "url": "https://docs.google.com/spreadsheets/d/1YTkzv-VQ6qRjhDPcHRiHDXfPpWW-MeYNPbyzdsC1MAE/edit", "provisional": false, "keywords": ["musicals", "theater", "theatre", "tickets", "attendance", "revenue", "performances", "entertainment"], "label": "Broadway"}, {"id": 3, "title": "Movies (Rotten Tomatoes)", "categories": ["Art"], "difficulty": 2.7, "novelty": 5.9, "description": "Movie characteristics, critic and audience scores, review counts, and Bechdel classifications.", "dwhy": "Familiar variables and straightforward rows; some missing classifications and multiple genres.", "nwhy": "Critic–audience disagreements and representation add interest beyond familiar movie ratings.", "url": "https://docs.google.com/spreadsheets/d/1Q-hrtWhX7QU9B2BF05_oQ1Wtz5D7ot-Scpv7ri-xftg/edit", "provisional": false, "keywords": ["film", "cinema", "Hollywood", "reviews", "critics", "audience", "Bechdel", "gender", "entertainment"], "label": "Movies"}, {"id": 4, "title": "Famous Paintings", "categories": ["Art"], "difficulty": 5.7, "novelty": 7.6, "description": "Paintings linked to artists, styles, subjects, museums, dimensions, and listed prices.", "dwhy": "Missing fields and uncertain price meanings require careful variable selection and interpretation.", "nwhy": "Makes patterns across artists, subjects, styles, and museum collections visible.", "url": "https://docs.google.com/spreadsheets/d/1vIBgPuwea1dWxa--x7gZiSdOo-k9UeXzOpfX3y1eQ1w/edit", "provisional": false, "keywords": ["painting", "museums", "artists", "visual", "art", "styles", "portrait", "landscape", "collections"], "label": "Paintings"}, {"id": 5, "title": "Art at Auction", "categories": ["Art"], "difficulty": 5.3, "novelty": 8.5, "description": "Artwork auction records with artists, sale dates, prices, dimensions, and auction houses.", "dwhy": "Skewed prices, missing artwork dates, and different price measures complicate comparisons.", "nwhy": "An uncommon view of the art market and the variation in what artworks fetch.", "url": "https://docs.google.com/spreadsheets/d/1_k9kinFw5JLNZ7OHkOJ0RsySSnskg3xC19XC_GW0JJk/edit", "provisional": false, "keywords": ["auctions", "money", "prices", "sales", "investment", "artists", "paintings", "sculpture", "market"], "label": "Art Auctions"}, {"id": 6, "title": "NYT Bestselling Books", "categories": ["Art"], "difficulty": 4.3, "novelty": 6.7, "description": "Bestseller appearances and rankings, provided in title-level and weekly tables.", "dwhy": "Choose the appropriate table and distinguish books from weekly appearances.", "nwhy": "Reveals bestseller longevity and ranking trajectories beyond recognizing popular titles.", "url": "https://docs.google.com/spreadsheets/d/15RunEVLaKoTphXOCOQAoTCX8xSFu3afpuOcOM_8fSTw/edit", "provisional": false, "keywords": ["literature", "reading", "publishing", "authors", "rankings", "popularity", "novels", "books"], "label": "NYT Books"}, {"id": 7, "title": "Netflix Engagement", "categories": ["Art"], "difficulty": 4.4, "novelty": 8.0, "description": "Viewing hours and views for movies and television seasons across reporting periods.", "dwhy": "Reporting periods, runtime, release timing, and hours versus views need careful handling.", "nwhy": "Viewing information audiences ordinarily see only through limited popularity lists.", "url": "https://docs.google.com/spreadsheets/d/1bJkYxNih4syNlPhLUnvL2RvGjqblYBvBiG6p4_VyW74/edit", "provisional": false, "keywords": ["streaming", "television", "TV", "film", "movies", "entertainment", "audiences", "watching", "viewing"], "label": "Netflix"}, {"id": 8, "title": "MLB Player Stats", "categories": ["Sports"], "difficulty": 6.4, "novelty": 4.6, "description": "Historical player-season batting and pitching statistics.", "dwhy": "Specialized metrics, historical missingness, team changes, and totals versus rates demand care.", "nwhy": "Familiar statistics with historical comparisons that can deepen the picture.", "url": "https://docs.google.com/spreadsheets/d/1uXy_eih-fMOs5A-IvWg-28UK5p2lg2Zst5w6SPp1-9M/edit", "provisional": false, "keywords": ["baseball", "batting", "pitching", "home", "runs", "strikeouts", "athletes", "performance", "seasons"], "label": "MLB Players"}, {"id": 9, "title": "NBA Player Stats", "categories": ["Sports"], "difficulty": 5.4, "novelty": 4.4, "description": "Historical basketball player-season statistics in per-game and season-total tables.", "dwhy": "Repeated players, changing statistical coverage, and per-game versus total measures matter.", "nwhy": "Familiar statistics become more revealing across careers and eras.", "url": "https://docs.google.com/spreadsheets/d/1NZtaeYvfu_jI9IB-PZgCnCt86hXG_QJgGtca9S401H0/edit", "provisional": false, "keywords": ["basketball", "hoops", "scoring", "rebounds", "assists", "athletes", "performance", "seasons"], "label": "NBA Players"}, {"id": 10, "title": "NHL Player Stats", "categories": ["Sports"], "difficulty": 6.0, "novelty": 5.0, "description": "Historical hockey player-season scoring, playing-time, and other performance statistics.", "dwhy": "Abbreviations, missing historical measures, and repeated players increase interpretation work.", "nwhy": "Historical depth, though much of the information is familiar to interested fans.", "url": "https://docs.google.com/spreadsheets/d/1qVS2B3Q6uz1bdsXwrLBbQ3C8acMZoCJ6FiXnKvGYQIs/edit", "provisional": false, "keywords": ["hockey", "ice", "skating", "goals", "assists", "athletes", "performance", "seasons"], "label": "NHL Players"}, {"id": 11, "title": "NFL Combine and Draft", "categories": ["Sports"], "difficulty": 5.1, "novelty": 6.0, "description": "Football prospects’ physical measurements, combine performances, and draft-related information.", "dwhy": "Missing test results, specialized units, and position differences require filtering.", "nwhy": "Connects athletic testing and prospect evaluations in ways fans may not examine systematically.", "url": "https://docs.google.com/spreadsheets/d/1a0EhteyoUpJ6l-7HjnK0x5VlJmWjNTzV14xESQ2CJJw/edit", "provisional": false, "keywords": ["football", "athletes", "prospects", "scouting", "draft", "sprint", "speed", "strength", "measurements"], "label": "NFL Combine"}, {"id": 12, "title": "NFL Games", "categories": ["Sports"], "difficulty": 6.9, "novelty": 7.0, "description": "NFL results with scheduling, weather, venue, betting, and team information.", "dwhy": "Single- and double-row versions, opposing perspectives, and betting variables create aggregation traps.", "nwhy": "Adds weather, rest, and expectations to the familiar story of wins and losses.", "url": "https://docs.google.com/spreadsheets/d/1bby12VAXJJ4dB0ILf6VbECSVoImdBmB9JwcbNhFuKOM/edit", "provisional": false, "keywords": ["football", "teams", "scores", "weather", "betting", "rest", "stadium", "wins", "losses"], "label": "NFL Games"}, {"id": 13, "title": "NFL Play-by-Play 2024", "categories": ["Sports"], "difficulty": 9.4, "novelty": 8.1, "description": "Individual NFL plays with game situations, play details, and outcomes.", "dwhy": "Play-level data typically needs extensive filtering and football-specific interpretation.", "nwhy": "Detailed situations and decisions offer a closer view than ordinary game summaries.", "url": "https://drive.google.com/file/d/1vpB-EOcQm-4LaZYI6pSCs2Tn8qjeNKWV/view", "provisional": false, "keywords": ["football", "plays", "offense", "defence", "defense", "touchdowns", "downs", "passing", "rushing", "strategy"], "label": "NFL Plays"}, {"id": 14, "title": "Soccer Video Game Player Rankings (FC25)", "categories": ["Sports"], "difficulty": 2.3, "novelty": 3.2, "description": "Player characteristics and game-assigned ratings for overall ability and specific skills.", "dwhy": "Tidied measurements and consistent ratings are accessible; goalkeeper fields need separate treatment.", "nwhy": "Interested players will recognize the information and many expected skill differences.", "url": "https://docs.google.com/spreadsheets/d/14cQRHl9OWt46EpUL9939oSHiLofTOvekUR1QODLLk10/edit", "provisional": false, "keywords": ["soccer", "football", "FIFA", "EA", "FC25", "gaming", "esports", "ratings", "athletes", "skills"], "label": "FC25 Players"}, {"id": 15, "title": "Football Video Game Ratings", "categories": ["Sports"], "difficulty": 2.9, "novelty": 3.1, "description": "Football players’ characteristics, positions, and game-assigned skill ratings.", "dwhy": "Straightforward records, but many skills are position-specific or use unfamiliar abbreviations.", "nwhy": "Mostly quantifies attributes and positional differences that fans already anticipate.", "url": "https://docs.google.com/spreadsheets/d/1Ureqi8XIVDXUEBaBP-hPxCrdIWjhzf1hbE77BOk0e8Y/edit", "provisional": false, "keywords": ["football", "Madden", "gaming", "esports", "ratings", "athletes", "skills", "positions"], "label": "Madden Players"}, {"id": 16, "title": "Basketball Video Game Player Ratings (2K25)", "categories": ["Sports"], "difficulty": 2.5, "novelty": 3.8, "description": "Basketball players’ physical characteristics, salaries, skill ratings, and badges.", "dwhy": "Accessible numeric ratings; badge fields and overlapping skill measures need explanation.", "nwhy": "Salary and physical comparisons add interest to familiar player evaluations.", "url": "https://docs.google.com/spreadsheets/d/1BysYkKR__Rpk11kKr0elOBAGtGdWHuKQ0_PGfdOtPTM/edit", "provisional": false, "keywords": ["basketball", "NBA2K", "2K25", "gaming", "esports", "salaries", "ratings", "athletes", "skills"], "label": "2K25 Players"}, {"id": 17, "title": "Masters Golf Results", "categories": ["Sports"], "difficulty": 3.4, "novelty": 4.9, "description": "Golfers’ round scores and tournament finishes across Masters tournaments.", "dwhy": "Repeated golfer-years, cuts, and incomplete rounds complicate simple score comparisons.", "nwhy": "Historical consistency and round-by-round patterns go beyond the list of winners.", "url": "https://docs.google.com/spreadsheets/d/1QWzqMIP6KSJbNp8RmSpxk5z9-gtxGPWbia_PCDGhepk/edit", "provisional": false, "keywords": ["golf", "Augusta", "tournament", "scores", "rounds", "players", "cuts", "sport"], "label": "Masters Golf"}, {"id": 18, "title": "F1 Racing", "categories": ["Sports"], "difficulty": 5.7, "novelty": 6.4, "description": "Driver results for individual races, including teams, starting positions, finishes, and status.", "dwhy": "Driver-race rows, non-finishes, repeated competitors, and changing eras need care.", "nwhy": "Patterns in starting position, reliability, teams, and careers beyond championship standings.", "url": "https://docs.google.com/spreadsheets/d/1Xtp9ApFG-Qe9YSuas2aGM9qNQb3YrFhSmnDgmPzku2E/edit", "provisional": false, "keywords": ["formula", "one", "formula", "1", "motorsport", "racing", "drivers", "cars", "circuits", "teams"], "label": "F1 Racing"}, {"id": 19, "title": "Board Games", "categories": ["Sports"], "difficulty": 5.4, "novelty": 7.9, "description": "Board game characteristics, categories, mechanics, ratings, popularity, and complexity measures.", "dwhy": "Multiple categories stored together, specialized ranking fields, and uneven rating counts add work.", "nwhy": "Shows how mechanics, complexity, playing time, and audience reception fit together.", "url": "https://docs.google.com/spreadsheets/d/1N7Yc9Qp0aDTdMv94eeRJVd97m0pl6OfsKThZl_J0uaU/edit", "provisional": false, "keywords": ["boardgames", "tabletop", "games", "gaming", "strategy", "mechanics", "complexity", "ratings", "recreation"], "label": "Board Games"}, {"id": 20, "title": "Plane Crashes", "categories": ["History"], "difficulty": 6.5, "novelty": 9.1, "description": "Historical aircraft accidents with dates, locations, aircraft details, casualties, and narratives.", "dwhy": "Missing information and overlapping casualty fields; accident counts alone do not measure flight risk.", "nwhy": "Detailed historical circumstances rarely visible in ordinary aviation summaries.", "url": "https://docs.google.com/spreadsheets/d/1JTvgVpFmZ8VIZts3JPA8x5j6QnXtP44ZjhjJ-2Upk5E/edit", "provisional": false, "keywords": ["aviation", "airplanes", "aircraft", "accidents", "disasters", "fatalities", "history", "safety"], "label": "Plane Crashes"}, {"id": 21, "title": "Titanic Data", "categories": ["History"], "difficulty": 3.1, "novelty": 5.5, "description": "Passenger characteristics, travel arrangements, and survival outcomes from the Titanic.", "dwhy": "Intuitive variables; missing ages and cabins and survival-rate denominators need attention.", "nwhy": "Passenger detail adds depth, although central survival patterns are widely familiar.", "url": "https://docs.google.com/spreadsheets/d/1fTCpxR_H_CKBPnmDggB-7ayuqlOgiRTRFkkdvAq8wK8/edit", "provisional": false, "keywords": ["ship", "ocean", "passengers", "survival", "disaster", "class", "gender", "families", "history"], "label": "Titanic"}, {"id": 22, "title": "Traffic Fatalities by State and Year", "categories": ["History"], "difficulty": 5.8, "novelty": 6.9, "description": "State-year traffic fatalities with demographic, economic, driving, and alcohol-policy measures.", "dwhy": "Coded variables, repeated states, and deaths versus exposure-adjusted rates matter.", "nwhy": "Places road-safety questions alongside less familiar policy and social context.", "url": "https://docs.google.com/spreadsheets/d/1PA49g2RKgo5gAsh7KCbNdMln0HNdewzKncyTiTmcB-c/edit", "provisional": false, "keywords": ["traffic", "driving", "cars", "crashes", "deaths", "road", "safety", "alcohol", "policy", "states"], "label": "Traffic Deaths"}, {"id": 23, "title": "Wars", "categories": ["History"], "difficulty": 7.3, "novelty": 8.8, "description": "War participation records with countries, sides, dates, outcomes, and battle deaths.", "dwhy": "A war can occupy several country records; multiple participation periods and outcome coding need care.", "nwhy": "A broad comparative view beyond the handful of wars students know well.", "url": "https://docs.google.com/spreadsheets/d/1t9cRETF4C3f1tqa2HKkVWMmHw3bt7Z-AoiUfbLlXk5I/edit", "provisional": false, "keywords": ["conflict", "military", "battles", "countries", "casualties", "deaths", "combat", "history"], "label": "Wars"}, {"id": 24, "title": "World Indicators", "categories": ["History", "Business"], " function labelLines(label){
// Keep small labels on one line; wrap longer labels into a compact centered block.
if(label.length<=11)return [label];

}

document.querySelectorAll('[data-sort]').forEach(b=>{b.onclick=()=>{if(sortKey===b.dataset.sort)ascending=!ascending;else{sortKey=b.dataset.sort;ascending=b.dataset.sort==='title';}document.querySelectorAll('[data-sort]').forEach(s=>s.parentElement.setAttribute('aria-sort',s.dataset.sort===sortKey?(ascending?'ascending':'descending'):'none'));render();};});
window.addEventListener('scroll',hideTip,{passive:true});window.addEventListener('resize',hideTip);document.addEventListener('keydown',e=>{if(e.key==='Escape')hideTip();});render();
</script></body></html>
